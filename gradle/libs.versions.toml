turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
# Gradle plugin artifacts — used as compileOnly deps in build-logic only
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
android-gradleApi = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
mannodermaus-android-junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "mannodermausJunit5" }
# Convention plugins — from build-logic included build (no version needed)
# Convention plugin → build-logic/src/main/kotlin/AmroKotlinLibraryConventionPlugin.kt
amro-kotlin-library = { id = "amro.kotlin.library" }
# Convention plugin → build-logic/src/main/kotlin/AmroAndroidLibraryConventionPlugin.kt
amro-android-library = { id = "amro.android.library" }
# Convention plugin → build-logic/src/main/kotlin/AmroAndroidHiltConventionPlugin.kt
amro-android-hilt = { id = "amro.android.hilt" }
# Convention plugin → build-logic/src/main/kotlin/AmroAndroidComposeConventionPlugin.kt
amro-android-compose = { id = "amro.android.compose" }

